<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 实时渲染预览工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #1e1e1e; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: #2d2d2d; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #404040; }
        .header h1 { font-size: 18px; color: #fff; font-weight: 600; }
        .header-actions { display: flex; gap: 10px; }
        button { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #357abd; }
        .btn-secondary { background: #404040; color: #fff; }
        .btn-secondary:hover { background: #505050; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover { background: #1e8449; }
        .main-container { display: flex; flex: 1; height: calc(100vh - 56px); transition: all 0.3s ease; }
        .editor-panel { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #404040; transition: border-color 0.3s, box-shadow 0.3s; position: relative; }
        .editor-panel.active { border-right-color: #4a90d9; box-shadow: inset 3px 0 0 #4a90d9; }
        .editor-panel.active .panel-header { background: #2d2d2d; border-bottom-color: #4a90d9; color: #4a90d9; }
        .panel-header { background: #2d2d2d; padding: 8px 16px; font-size: 13px; color: #888; border-bottom: 1px solid #404040; display: flex; justify-content: space-between; align-items: center; transition: color 0.3s, border-color 0.3s; }
        .panel-header-left { display: flex; align-items: center; gap: 8px; }
        .panel-header-right { display: flex; align-items: center; gap: 6px; }
        .panel-swap-btn { background: transparent; border: 1px solid #555; color: #888; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .panel-swap-btn:hover { background: #404040; color: #fff; border-color: #888; }
        .panel-indicator { width: 3px; height: 16px; border-radius: 2px; transition: all 0.3s; }
        .panel-indicator.editor-ind { background: #555; }
        .panel-indicator.preview-ind { background: #555; }
        .editor-panel.active .panel-indicator.editor-ind { background: #4a90d9; box-shadow: 0 0 6px #4a90d9; }
        .preview-panel.active .panel-indicator.preview-ind { background: #27ae60; box-shadow: 0 0 6px #27ae60; }
        .editor-wrapper { flex: 1; position: relative; }
        textarea { width: 100%; height: 100%; background: transparent; color: transparent; border: none; padding: 16px; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 14px; line-height: 1.6; resize: none; outline: none; tab-size: 2; caret-color: #d4d4d4; position: relative; z-index: 1; }
        .preview-panel { width: 50%; display: flex; flex-direction: column; transition: border-color 0.3s, box-shadow 0.3s; position: relative; }
        .preview-panel.active { border-left: 3px solid #27ae60; box-shadow: inset -3px 0 0 #27ae60; }
        .preview-panel.active .panel-header { background: #2d2d2d; border-bottom-color: #27ae60; color: #27ae60; }
        .preview-frame { flex: 1; border: none; background: #fff; }
        .panel-enter { animation: panelSlideIn 0.3s ease; }
        @keyframes panelSlideIn { from { opacity: 0.5; transform: scaleX(0.97); } to { opacity: 1; transform: scaleX(1); } }
        .status-bar { background: #2d2d2d; padding: 6px 16px; font-size: 12px; color: #888; border-top: 1px solid #404040; display: flex; justify-content: space-between; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
        .toast.show { opacity: 1; }
        .template-dropdown { position: relative; }
        .template-menu { position: absolute; top: 100%; right: 0; background: #2d2d2d; border: 1px solid #404040; border-radius: 8px; padding: 8px 0; min-width: 200px; display: none; z-index: 100; }
        .template-menu.show { display: block; }
        .template-item { padding: 8px 16px; color: #d4d4d4; cursor: pointer; font-size: 13px; }
        .template-item:hover { background: #404040; }
        .resize-handle { width: 4px; background: #404040; cursor: col-resize; transition: background 0.2s; }
        .resize-handle:hover { background: #4a90d9; }
        .search-bar { display: flex; align-items: center; gap: 6px; background: #363636; padding: 4px 8px; border-radius: 6px; }
        .search-bar input { background: transparent; border: none; color: #d4d4d4; font-size: 13px; width: 160px; outline: none; }
        .search-bar input::placeholder { color: #777; }
        .search-bar button { padding: 4px 8px; background: #404040; border: none; color: #aaa; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .search-bar button:hover { background: #505050; color: #fff; }
        .search-count { color: #888; font-size: 12px; min-width: 50px; text-align: center; }
        .search-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
        .search-highlight { background: #ffeb3b !important; color: #333 !important; border-radius: 2px; }
        .search-highlight-cur { background: #ff9800 !important; color: #333 !important; border-radius: 2px; }
        .code-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 16px; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; overflow: hidden; pointer-events: none; color: transparent; }
        .code-overlay .hl { background: #ffeb3b; color: #333; border-radius: 2px; }
        .code-overlay .hl-cur { background: #ff9800; color: #333; border-radius: 2px; }
        .editor-wrapper { position: relative; }
        .editor-mirror { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 16px; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; overflow-x: hidden; color: #d4d4d4; pointer-events: none; }
        .btn-export { background: #e67e22; }
        .btn-export:hover { background: #d35400; }
        .btn-export:disabled { background: #7d6b5a; cursor: not-allowed; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loading-overlay.hidden { display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #404040; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #fff; margin-top: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎨 HTML 实时渲染预览</h1>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索关键字..." onkeydown="if(event.key==='Enter')highlightNext()">
            <span class="search-count" id="searchCount">0/0</span>
            <button id="searchPrev" onclick="highlightPrev()" title="上一个">▲</button>
            <button id="searchNext" onclick="highlightNext()" title="下一个">▼</button>
            <button onclick="clearSearch()" title="清除搜索">✕</button>
        </div>
        <div class="header-actions">
            <div class="template-dropdown">
                <button class="btn-secondary" onclick="toggleTemplateMenu()">📄 模板</button>
                <div class="template-menu" id="templateMenu">
                    <div class="template-item" onclick="loadTemplate('blank')">空白页面</div>
                    <div class="template-item" onclick="loadTemplate('basic')">基础HTML结构</div>
                    <div class="template-item" onclick="loadTemplate('button')">按钮组件</div>
                    <div class="template-item" onclick="loadTemplate('card')">卡片布局</div>
                    <div class="template-item" onclick="loadTemplate('form')">表单示例</div>
                </div>
            </div>
            <button class="btn-primary" onclick="pasteAndRender()">📋 粘贴并渲染</button>
            <button class="btn-success" onclick="copyHTML()">📥 复制HTML</button>
            <button class="btn-export" onclick="exportHTML()">💾 导出HTML</button>
            <button class="btn-secondary" onclick="clearEditor()">🗑️ 清空</button>
        </div>
    </div>

    <div class="main-container">
        <div class="editor-panel" id="editorPanel">
            <div class="panel-header">
                <div class="panel-header-left">
                    <span class="panel-indicator editor-ind"></span>
                    <span>📝 HTML 编辑器</span>
                </div>
                <div class="panel-header-right">
                    <button class="panel-swap-btn" onclick="swapPanels()" title="交换面板位置">⇄ 交换</button>
                </div>
            </div>
            <div class="editor-wrapper">
                <textarea id="editor" placeholder="在此粘贴或输入 HTML 代码...&#10;&#10;例如：&#10;<h1>Hello World</h1>&#10;<p>这是一个实时预览工具</p>" spellcheck="false"></textarea>
                <div class="editor-mirror" id="codeMirror"></div>
            </div>
        </div>

        <div class="resize-handle" id="resizeHandle"></div>

        <div class="preview-panel" id="previewPanel">
            <div class="panel-header">
                <div class="panel-header-left">
                    <span class="panel-indicator preview-ind"></span>
                    <span>👁️ 实时预览</span>
                </div>
                <div class="panel-header-right">
                    <button class="panel-swap-btn" onclick="swapPanels()" title="交换面板位置">⇄ 交换</button>
                </div>
            </div>
            <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>

    <div class="status-bar">
        <span id="charCount">0 字符</span>
        <span id="statusText">就绪</span>
    </div>

    <div class="toast" id="toast"></div>
    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">正在生成HTML文件...</div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const previewFrame = document.getElementById('previewFrame');
        const charCount = document.getElementById('charCount');
        const statusText = document.getElementById('statusText');
        const toastEl = document.getElementById('toast');
        const templateMenu = document.getElementById('templateMenu');
        const editorPanel = document.getElementById('editorPanel');
        const previewPanel = document.getElementById('previewPanel');
        const resizeHandle = document.getElementById('resizeHandle');

        let renderTimeout;

        const templates = {
            blank: '',
            basic: '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>我的页面</title>\n    <style>\n        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }\n    </style>\n</head>\n<body>\n    <h1>Hello World</h1>\n    <p>这是一个基础HTML页面</p>\n</body>\n</html>',
            button: '<button style="padding: 12px 24px; background: #4a90d9; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">点击我</button>\n\n<button style="padding: 12px 24px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-left: 10px;">成功按钮</button>',
            card: '<div style="max-width: 400px; margin: 40px auto; background: white; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); overflow: hidden;">\n    <div style="height: 200px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>\n    <div style="padding: 20px;">\n        <h2 style="margin: 0 0 10px 0;">卡片标题</h2>\n        <p style="color: #666; margin: 0;">这是一段卡片描述文字，可以放置一些简短的说明内容。</p>\n        <button style="margin-top: 15px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">了解更多</button>\n    </div>\n</div>',
            form: '<form style="max-width: 400px; margin: 40px auto; padding: 30px; background: #f5f5f5; border-radius: 12px;">\n    <h2 style="margin: 0 0 20px 0;">用户登录</h2>\n    <div style="margin-bottom: 15px;">\n        <label style="display: block; margin-bottom: 5px; font-size: 14px;">用户名</label>\n        <input type="text" placeholder="请输入用户名" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">\n    </div>\n    <div style="margin-bottom: 20px;">\n        <label style="display: block; margin-bottom: 5px; font-size: 14px;">密码</label>\n        <input type="password" placeholder="请输入密码" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">\n    </div>\n    <button type="submit" style="width: 100%; padding: 12px; background: #4a90d9; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;">登录</button>\n</form>'
        };

        function updatePreview() {
            const html = editor.value;
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open(); doc.write(html); doc.close();
            charCount.textContent = html.length + ' 字符';
            statusText.textContent = '已更新';
            if (document.getElementById('searchInput').value.trim() !== '') {
                clearSearch();
            }
        }

        editor.addEventListener('input', () => {
            clearTimeout(renderTimeout);
            statusText.textContent = '输入中...';
            renderTimeout = setTimeout(updatePreview, 300);
        });

        async function pasteAndRender() {
            try { const text = await navigator.clipboard.readText(); editor.value = text; updatePreview(); showToast('已粘贴并渲染 ✅'); } catch (e) { editor.focus(); showToast('请手动粘贴（Ctrl+V）'); }
        }

        function copyHTML() {
            const text = editor.value;
            if (!text) { showToast('没有可复制的内容'); return; }
            navigator.clipboard.writeText(text).then(() => showToast('已复制HTML代码 ✅')).catch(() => { editor.select(); document.execCommand('copy'); showToast('已复制HTML代码 ✅'); });
        }

        function exportHTML() {
            const html = editor.value.trim();
            if (!html) {
                showToast('没有可导出的内容');
                return;
            }

            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const exportBtn = document.querySelector('.btn-export');

            loadingOverlay.classList.remove('hidden');
            exportBtn.disabled = true;
            loadingText.textContent = '正在生成HTML文件...';

            try {
                setTimeout(() => {
                    let finalHtml = html;

                    const hasDoctype = /^<!DOCTYPE/i.test(html);
                    const hasHtmlTag = /<html[\s>]/i.test(html);
                    const hasHeadTag = /<head[\s>]/i.test(html);
                    const hasBodyTag = /<body[\s>]/i.test(html);

                    if (!hasDoctype && !hasHtmlTag) {
                        const now = new Date();
                        const title = html.match(/<title[^>]*>([^<]*)<\/title>/i)?.[1] || 'Exported Page';
                        const bodyContent = hasBodyTag ? html : html;
                        const headContent = hasHeadTag ? html.match(/<head[^>]*>[\s\S]*?<\/head>/i)?.[0] || '' : '';

                        finalHtml = `<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>${title}</title>\n${headContent.replace(/<\/?head[^>]*>/gi, '')}\n</head>\n<body>\n${bodyContent.replace(/<\/?body[^>]*>/gi, '')}\n</body>\n</html>`;
                    } else if (!hasDoctype) {
                        finalHtml = '<!DOCTYPE html>\n' + html;
                    }

                    const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
                    const filename = `export_${timestamp}.html`;

                    const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });

                    if (blob.size > 5 * 1024 * 1024) {
                        loadingText.textContent = `文件较大 (${(blob.size / 1024 / 1024).toFixed(1)}MB)，准备下载...`;
                    }

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    loadingOverlay.classList.add('hidden');
                    exportBtn.disabled = false;
                    showToast(`已导出 ${filename} ✅`);
                }, 100);
            } catch (err) {
                loadingOverlay.classList.add('hidden');
                exportBtn.disabled = false;
                showToast('导出失败: ' + err.message);
            }
        }

        function clearEditor() { editor.value = ''; updatePreview(); editor.focus(); showToast('已清空'); }

        function loadTemplate(name) { editor.value = templates[name]; updatePreview(); templateMenu.classList.remove('show'); showToast('已加载模板'); }

        function toggleTemplateMenu() { templateMenu.classList.toggle('show'); }

        document.addEventListener('click', (e) => { if (!e.target.closest('.template-dropdown')) templateMenu.classList.remove('show'); });

        function showToast(message) { toastEl.textContent = message; toastEl.classList.add('show'); clearTimeout(toastEl._timeout); toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), 2000); }

        let isResizing = false;
        resizeHandle.addEventListener('mousedown', (e) => { isResizing = true; document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerRect = document.querySelector('.main-container').getBoundingClientRect();
            const percentage = ((e.clientX - containerRect.left) / containerRect.width) * 100;
            const clamped = Math.max(20, Math.min(80, percentage));
            editorPanel.style.width = clamped + '%';
            previewPanel.style.width = (100 - clamped) + '%';
        });
        document.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; });

        let panelsSwapped = false;

        function swapPanels() {
            const container = document.querySelector('.main-container');
            const handle = document.getElementById('resizeHandle');
            panelsSwapped = !panelsSwapped;

            if (panelsSwapped) {
                container.style.flexDirection = 'row-reverse';
                editorPanel.style.borderRight = 'none';
                editorPanel.style.borderLeft = '1px solid #404040';
                previewPanel.style.borderLeft = 'none';
                previewPanel.style.borderRight = '1px solid #404040';
                showToast('已交换面板位置 ⇄');
            } else {
                container.style.flexDirection = 'row';
                editorPanel.style.borderRight = '1px solid #404040';
                editorPanel.style.borderLeft = 'none';
                previewPanel.style.borderLeft = 'none';
                previewPanel.style.borderRight = 'none';
                showToast('已恢复面板位置 ⇄');
            }

            editorPanel.classList.add('panel-enter');
            previewPanel.classList.add('panel-enter');
            setTimeout(() => {
                editorPanel.classList.remove('panel-enter');
                previewPanel.classList.remove('panel-enter');
            }, 300);
        }

        function activateEditor() {
            editorPanel.classList.add('active');
            previewPanel.classList.remove('active');
        }

        function activatePreview() {
            previewPanel.classList.add('active');
            editorPanel.classList.remove('active');
        }

        function clearPanelActive() {
            editorPanel.classList.remove('active');
            previewPanel.classList.remove('active');
        }

        editor.addEventListener('focus', activateEditor);
        editor.addEventListener('click', activateEditor);
        
        previewFrame.addEventListener('mouseenter', activatePreview);
        previewPanel.addEventListener('mouseenter', activatePreview);
        
        document.addEventListener('click', (e) => {
            const target = e.target;
            if (!target.closest('.editor-panel') && !target.closest('.preview-panel')) {
                clearPanelActive();
            }
        });

        let currentMatchIndex = -1;
        let totalMatches = 0;
        let searchTimer;
        const codeMirror = document.getElementById('codeMirror');

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function doSearch(keyword) {
            clearHighlightsAll();
            currentMatchIndex = -1;
            totalMatches = 0;
            if (!keyword || keyword.trim() === '') {
                updateSearchUI();
                return;
            }
            const regex = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

            // Editor mirror highlighting
            const code = editor.value;
            let match;
            const editorMatches = [];
            while ((match = regex.exec(code)) !== null) {
                editorMatches.push({ index: match.index, text: match[0] });
            }

            let highlighted = '';
            let lastIndex = 0;
            editorMatches.forEach((m) => {
                highlighted += escapeHtml(code.substring(lastIndex, m.index));
                highlighted += '<span class="hl">' + escapeHtml(m.text) + '</span>';
                lastIndex = m.index + m.text.length;
            });
            highlighted += escapeHtml(code.substring(lastIndex));
            codeMirror.innerHTML = highlighted;

            // Preview highlighting
            const doc = previewFrame.contentDocument;
            if (doc && doc.body) {
                const walker = document.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
                const nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(node => {
                    const text = node.textContent;
                    let m;
                    while ((m = regex.exec(text)) !== null) {
                        const span = doc.createElement('span');
                        span.className = 'search-highlight';
                        const before = doc.createTextNode(text.substring(0, m.index));
                        const after = doc.createTextNode(text.substring(m.index + m.text.length));
                        const hlText = doc.createTextNode(m.text);
                        span.appendChild(hlText);
                        const frag = doc.createDocumentFragment();
                        frag.appendChild(before);
                        frag.appendChild(span);
                        frag.appendChild(after);
                        node.parentNode.replaceChild(frag, node);
                        regex.lastIndex = 0;
                    }
                });
            }

            totalMatches = editorMatches.length;
            if (totalMatches > 0) {
                currentMatchIndex = 0;
                scrollToMatch(0);
            }
            updateSearchUI();
        }

        function clearHighlightsAll() {
            codeMirror.innerHTML = escapeHtml(editor.value);
            const doc = previewFrame.contentDocument;
            if (doc && doc.body) {
                doc.querySelectorAll('.search-highlight').forEach(h => {
                    const parent = h.parentNode;
                    while (h.firstChild) parent.insertBefore(h.firstChild, h);
                    parent.removeChild(h);
                    parent.normalize();
                });
            }
        }

        function scrollToMatch(index) {
            const allHls = codeMirror.querySelectorAll('.hl');
            if (!allHls[index]) return;
            allHls.forEach(h => h.classList.remove('hl-cur'));
            const target = allHls[index];
            target.classList.add('hl-cur');
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const doc = previewFrame.contentDocument;
            if (doc && doc.body) {
                doc.querySelectorAll('.search-highlight').forEach(h => h.classList.remove('search-highlight-cur'));
                const previewHls = doc.querySelectorAll('.search-highlight');
                if (previewHls[index]) {
                    previewHls[index].classList.add('search-highlight-cur');
                    previewHls[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function updateSearchUI() {
            const countEl = document.getElementById('searchCount');
            const prevBtn = document.getElementById('searchPrev');
            const nextBtn = document.getElementById('searchNext');
            if (totalMatches === 0) {
                const kw = document.getElementById('searchInput').value.trim();
                countEl.textContent = kw ? '0/0' : '0/0';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
            } else {
                countEl.textContent = (currentMatchIndex + 1) + '/' + totalMatches;
                prevBtn.disabled = false;
                nextBtn.disabled = false;
            }
        }

        function highlightNext() {
            if (totalMatches === 0) return;
            currentMatchIndex = (currentMatchIndex + 1) % totalMatches;
            scrollToMatch(currentMatchIndex);
            updateSearchUI();
        }

        function highlightPrev() {
            if (totalMatches === 0) return;
            currentMatchIndex = (currentMatchIndex - 1 + totalMatches) % totalMatches;
            scrollToMatch(currentMatchIndex);
            updateSearchUI();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            clearHighlightsAll();
            currentMatchIndex = -1;
            totalMatches = 0;
            updateSearchUI();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => doSearch(e.target.value), 300);
        });

        editor.addEventListener('scroll', () => {
            codeMirror.scrollTop = editor.scrollTop;
            codeMirror.scrollLeft = editor.scrollLeft;
        });

        editor.addEventListener('input', () => {
            codeMirror.innerHTML = escapeHtml(editor.value);
            const kw = document.getElementById('searchInput').value.trim();
            if (kw) doSearch(kw);
        });

        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart; const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 2;
                updatePreview();
            }
        });

        editor.focus();
    </script>
</body>
</html>
