<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>????????</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5; min-height: 100vh; display: flex;
            justify-content: center; align-items: flex-start; padding: 20px;
        }
        .container {
            width: 100%; max-width: 900px; background: #fff; border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08); padding: 32px; margin-top: 20px;
        }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 6px; }
        .header p { font-size: 14px; color: #888; }
        .section { margin-bottom: 20px; }
        .section-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .section-label span { font-size: 14px; font-weight: 600; color: #333; }
        .section-label .badge { font-size: 12px; color: #888; background: #f0f0f0; padding: 2px 10px; border-radius: 10px; }
        textarea {
            width: 100%; min-height: 180px; border: 2px solid #e0e0e0; border-radius: 8px;
            padding: 14px 16px; font-size: 15px; line-height: 1.6; resize: vertical;
            font-family: inherit; transition: border-color 0.2s; outline: none;
        }
        textarea:focus { border-color: #4a90d9; }
        textarea#output { background: #fafafa; color: #333; }
        .stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
        .stat-item { flex: 1; min-width: 100px; background: #f8f9fa; border-radius: 8px; padding: 12px 16px; text-align: center; }
        .stat-item .stat-value { font-size: 24px; font-weight: 700; color: #e74c3c; }
        .stat-item .stat-label { font-size: 12px; color: #888; margin-top: 2px; }
        .stat-item.clean .stat-value { color: #27ae60; }
        .stat-item.replace .stat-value { color: #f39c12; }
        .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
        button { flex: 1; min-width: 100px; padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #357abd; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-danger { background: #fff; color: #e74c3c; border: 2px solid #e74c3c; }
        .btn-danger:hover { background: #e74c3c; color: #fff; }
        .btn-add { background: #27ae60; color: #fff; }
        .btn-add:hover { background: #1e8449; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-warning:hover { background: #e67e22; }
        .btn-remove { background: #fff; color: #e74c3c; border: 1px solid #e74c3c; padding: 6px 10px; min-width: auto; font-size: 12px; }
        .btn-remove:hover { background: #e74c3c; color: #fff; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
        .toast.show { opacity: 1; }
        .replace-section { background: #fafafa; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .replace-section h3 { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .replace-rules { display: flex; flex-direction: column; gap: 10px; }
        .replace-rule { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .replace-rule input { flex: 1; min-width: 120px; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .replace-rule input:focus { border-color: #4a90d9; }
        .replace-rule .arrow { font-size: 18px; color: #888; padding: 0 5px; }
        .toggle-switch { display: flex; align-items: center; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0; }
        .toggle-switch label { font-size: 14px; color: #666; cursor: pointer; }
        .toggle { position: relative; width: 44px; height: 24px; background: #e0e0e0; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .toggle.active { background: #4a90d9; }
        .toggle::after { content: ''; position: absolute; width: 20px; height: 20px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: left 0.2s; }
        .toggle.active::after { left: 22px; }
        .preset-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .preset-tag { padding: 4px 12px; background: #e8f4fd; color: #4a90d9; border-radius: 15px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .preset-tag:hover { background: #4a90d9; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>?? ????????</h1>
            <p>?????? + ???????</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item"><div class="stat-value" id="totalChars">0</div><div class="stat-label">????</div></div>
            <div class="stat-item"><div class="stat-value" id="specialCount">0</div><div class="stat-label">?????</div></div>
            <div class="stat-item replace"><div class="stat-value" id="replaceCount">0</div><div class="stat-label">????</div></div>
            <div class="stat-item clean"><div class="stat-value" id="cleanChars">0</div><div class="stat-label">??????</div></div>
        </div>

        <div class="replace-section">
            <h3>?? ???????</h3>
            <div class="toggle-switch">
                <div class="toggle" id="replaceToggle" onclick="toggleReplace()"></div>
                <label for="replaceToggle">???????</label>
            </div>
            <div class="preset-tags" id="presetTags">
                <span class="preset-tag" onclick="addPreset('??', '????')">?? ? ????</span>
                <span class="preset-tag" onclick="addPreset('??', '????')">?? ? ????</span>
                <span class="preset-tag" onclick="addPreset('???', '????')">??? ? ????</span>
            </div>
            <div class="replace-rules" id="replaceRules">
                <div class="replace-rule">
                    <input type="text" class="replace-from" placeholder="??????" value="??">
                    <span class="arrow">?</span>
                    <input type="text" class="replace-to" placeholder="???">
                    <button class="btn-remove" onclick="removeRule(this)">??</button>
                </div>
            </div>
            <button class="btn-add" style="margin-top: 10px; width: 100%;" onclick="addRule()">+ ??????</button>
        </div>

        <div class="section">
            <div class="section-label"><span>?? ????</span><span class="badge" id="inputBadge">0 ??</span></div>
            <textarea id="input" placeholder="?????????..."></textarea>
        </div>

        <div class="section">
            <div class="section-label"><span>? ????</span><span class="badge" id="outputBadge">0 ??</span></div>
            <textarea id="output" placeholder="????????????..." readonly></textarea>
        </div>

        <div class="btn-row">
            <button class="btn-primary" onclick="copyOutput()">?? ????</button>
            <button class="btn-secondary" onclick="clearAll()">??? ??</button>
            <button class="btn-danger" onclick="pasteAndClean()">?? ?????</button>
            <button class="btn-warning" onclick="removeHashesOnly()"># ????????</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const totalCharsEl = document.getElementById('totalChars');
        const specialCountEl = document.getElementById('specialCount');
        const replaceCountEl = document.getElementById('replaceCount');
        const cleanCharsEl = document.getElementById('cleanChars');
        const inputBadge = document.getElementById('inputBadge');
        const outputBadge = document.getElementById('outputBadge');
        const toastEl = document.getElementById('toast');
        const replaceToggle = document.getElementById('replaceToggle');
        const replaceRules = document.getElementById('replaceRules');

        let replaceEnabled = true;
        let totalReplaceCount = 0;

        function removeSpecialChars(text) { return text.replace(/[#*]/g, ''); }
        function countSpecialChars(text) { return (text.match(/[#*]/g) || []).length; }

        function applyReplacements(text) {
            if (!replaceEnabled) return { result: text, count: 0 };
            let result = text, count = 0;
            const rules = document.querySelectorAll('.replace-rule');
            rules.forEach(rule => {
                const from = rule.querySelector('.replace-from').value.trim();
                const to = rule.querySelector('.replace-to').value.trim();
                if (from && to) {
                    const regex = new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
                    const matches = result.match(regex);
                    if (matches) count += matches.length;
                    result = result.replace(regex, to);
                }
            });
            return { result, count };
        }

        function updateStats(inputText, outputText, replaceCount) {
            totalCharsEl.textContent = inputText.length;
            specialCountEl.textContent = countSpecialChars(inputText);
            replaceCountEl.textContent = replaceCount;
            cleanCharsEl.textContent = outputText.length;
            inputBadge.textContent = inputText.length + ' ??';
            outputBadge.textContent = outputText.length + ' ??';
        }

        function processText() {
            const inputText = inputEl.value;
            let result = removeSpecialChars(inputText);
            const replaceResult = applyReplacements(result);
            result = replaceResult.result;
            totalReplaceCount = replaceResult.count;
            outputEl.value = result;
            updateStats(inputText, result, totalReplaceCount);
        }

        inputEl.addEventListener('input', processText);

        function toggleReplace() {
            replaceEnabled = !replaceEnabled;
            replaceToggle.classList.toggle('active', replaceEnabled);
            processText();
        }

        function addRule() {
            const rule = document.createElement('div');
            rule.className = 'replace-rule';
            rule.innerHTML = '<input type="text" class="replace-from" placeholder="??????"><span class="arrow">?</span><input type="text" class="replace-to" placeholder="???"><button class="btn-remove" onclick="removeRule(this)">??</button>';
            replaceRules.appendChild(rule);
            rule.querySelectorAll('input').forEach(input => input.addEventListener('input', processText));
            processText();
        }

        function removeRule(btn) { btn.parentElement.remove(); processText(); }

        function addPreset(from, to) {
            const rules = document.querySelectorAll('.replace-rule');
            let emptyRule = null;
            rules.forEach(rule => {
                const fromInput = rule.querySelector('.replace-from');
                const toInput = rule.querySelector('.replace-to');
                if (!fromInput.value.trim() && !toInput.value.trim()) emptyRule = rule;
            });
            if (emptyRule) {
                emptyRule.querySelector('.replace-from').value = from;
                emptyRule.querySelector('.replace-to').value = to;
            } else {
                addRule();
                const lastRule = document.querySelectorAll('.replace-rule')[document.querySelectorAll('.replace-rule').length - 1];
                lastRule.querySelector('.replace-from').value = from;
                lastRule.querySelector('.replace-to').value = to;
            }
            processText();
            showToast('?????: ' + from + ' ? ' + to);
        }

        function copyOutput() {
            const text = outputEl.value;
            if (!text) { showToast('????????'); return; }
            navigator.clipboard.writeText(text).then(() => showToast('??????? ?')).catch(() => { outputEl.select(); document.execCommand('copy'); showToast('??????? ?'); });
        }

        function clearAll() {
            inputEl.value = ''; outputEl.value = '';
            replaceRules.innerHTML = '<div class="replace-rule"><input type="text" class="replace-from" placeholder="??????" value="??"><span class="arrow">?</span><input type="text" class="replace-to" placeholder="???"><button class="btn-remove" onclick="removeRule(this)">??</button></div>';
            updateStats('', '', 0); inputEl.focus(); showToast('???');
        }

        async function pasteAndClean() {
            try { const text = await navigator.clipboard.readText(); inputEl.value = text; processText(); showToast('?????? ?'); } catch (e) { inputEl.focus(); showToast('?????(Ctrl+V)'); }
        }

        function removeHashesOnly() {
            const inputText = inputEl.value;
            if (!inputText) { showToast('????????'); return; }
            const cleaned = removeSpecialChars(inputText);
            outputEl.value = cleaned; updateStats(inputText, cleaned, 0);
            showToast('??? # ? * ?');
        }

        function showToast(message) {
            toastEl.textContent = message; toastEl.classList.add('show');
            clearTimeout(toastEl._timeout);
            toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), 2000);
        }

        document.querySelectorAll('.replace-from, .replace-to').forEach(input => input.addEventListener('input', processText));
        inputEl.focus();
    </script>
</body>
</html>
